services:
  # 1. PostgreSQL Database Service
  postgres:
    image: postgres:16-alpine
    container_name: festival_11kadrov_db
    restart: always
    environment:
      POSTGRES_DB: ${SQL_DB_NAME:-festival_11_kadrov}
      POSTGRES_USER: ${SQL_USER:-festival_admin}
      POSTGRES_PASSWORD: ${SQL_PASSWORD:-Festival2026SecurePass!}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SQL_USER:-festival_admin} -d ${SQL_DB_NAME:-festival_11_kadrov}"]
      interval: 5s
      timeout: 5s
      retries: 6

  # 2. Main Application Service (Vite Frontend + Express Backend + Database + Mailer)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: festival_11kadrov_app
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      # Database connection
      SQL_HOST: postgres
      SQL_PORT: 5432
      SQL_DB_NAME: ${SQL_DB_NAME:-festival_11_kadrov}
      SQL_USER: ${SQL_USER:-festival_admin}
      SQL_PASSWORD: ${SQL_PASSWORD:-Festival2026SecurePass!}
      # Mail service connection (Mail.ru / SMTP)
      NOTIFICATION_EMAIL: ${NOTIFICATION_EMAIL:-chita11kadrov@mail.ru}
      SMTP_HOST: ${SMTP_HOST:-smtp.mail.ru}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-chita11kadrov@mail.ru}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-"Фестиваль 11 кадров" <chita11kadrov@mail.ru>}
      # App URL for external links
      APP_URL: ${APP_URL:-http://localhost:3000}
      # Optional AI Studio Key
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "3000:3000"

volumes:
  pgdata:
    driver: local
